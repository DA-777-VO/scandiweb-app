services:
  db:
    image: mysql:8.0
    container_name: scandiweb_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: scandiweb
      MYSQL_USER: scandiweb
      MYSQL_PASSWORD: scandiweb
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./scandiwebBackend/database/migrate.sql:/docker-entrypoint-initdb.d/migrate.sql:ro
    networks:
      - scandiweb_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./scandiwebBackend
      dockerfile: Dockerfile
    container_name: scandiweb_backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: scandiweb
      DB_USER: scandiweb
      DB_PASSWORD: scandiweb
      APP_DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./scandiwebBackend:/var/www/html
    networks:
      - scandiweb_net
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./scandiwebFrontend
      dockerfile: Dockerfile
    container_name: scandiweb_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./scandiwebFrontend:/app
      - /app/node_modules
    networks:
      - scandiweb_net
    depends_on:
      - backend

networks:
  scandiweb_net:
    driver: bridge
